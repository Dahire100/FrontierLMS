name: Backend Deploy to AWS

on:
  push:
    branches:
      - Main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1  # Mumbai region - change as needed
  ECR_REPOSITORY: frontier-lms-backend
  ECS_SERVICE: frontier-lms-backend-service
  ECS_CLUSTER: frontier-lms-cluster
  CONTAINER_NAME: frontier-lms-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Verify backend can load without errors
      - name: Validate backend loads
        run: |
          node -e "
            try {
              // Test-load key modules (not server.js which tries to connect to DB)
              require('./src/models/User');
              require('./src/models/School');
              require('./src/middleware/auth');
              console.log('✅ Backend modules loaded successfully');
            } catch(e) {
              console.error('❌ Module load error:', e.message);
              process.exit(1);
            }
          "

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Uncomment below if using ECS
      # - name: Deploy to Amazon ECS
      #   uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      #   with:
      #     task-definition: task-definition.json
      #     service: ${{ env.ECS_SERVICE }}
      #     cluster: ${{ env.ECS_CLUSTER }}
      #     wait-for-service-stability: true

      # Alternative: Deploy to EC2 via SSH
      # - name: Deploy to EC2
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ${{ secrets.EC2_USERNAME }}
      #     key: ${{ secrets.EC2_SSH_KEY }}
      #     script: |
      #       cd /home/ubuntu/frontier-lms/backend
      #       git pull origin Main
      #       npm ci --only=production
      #       pm2 restart frontier-backend

      - name: Deployment Success
        if: success()
        run: echo "✅ Backend deployed successfully!"

      - name: Deployment Failure
        if: failure()
        run: echo "❌ Backend deployment failed!"
